[package]
name = "prophecy"
description = "Prophecies: findings, drafts, suggested actions and improvements with provenance, host-stamped identity and terminal resolution (SPEC.md v0.2)"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
schemars = { version = "0.8", features = ["chrono"] }
sha2 = "0.10"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "warn"
