[package]
name = "prophecy"
description = "Prophecy types: findings, drafts, suggested actions and improvements with provenance and terminal resolution"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
schemars = { version = "0.8", features = ["chrono"] }

[lints]
workspace = true